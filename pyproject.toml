[project]
name = "coicop-model-benchmark"
version = "0.3.2"
description = "Benchmark COICOP category classification across OpenAI GPT-5.6 Luna, DeepSeek V4.1 Flash, and TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.100.0",
    "openpyxl>=3.1.5",
    "typesafe-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "BLE", "EXE"]
